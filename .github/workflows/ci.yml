name: Continuous Integration & Automated Tests

on:
  push:
    branches: [ main, master, staging ]
  pull_request:
    branches: [ main, master, staging ]

jobs:
  test-and-build:
    name: Lint, Test & Build (Frontend)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Run Automated Test Suite (Vitest)
        run: npm run test
        env:
          NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum
          NEXTAUTH_URL: http://localhost:3000

      - name: Verify Production Build & PWA Generation
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nybf_test
          NEXTAUTH_SECRET: ci-secret-key-32-characters-minimum
          NEXTAUTH_URL: http://localhost:3000
          RESEND_API_KEY: ""
          AFRICASTALKING_API_KEY: ""
          AFRICASTALKING_USERNAME: ""
